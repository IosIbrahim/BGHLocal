name: dr_baksh_dashboard
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  dio: ^5.9.1
  json_annotation: ^4.9.0
  #  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  pretty_dio_logger: ^1.1.1
  shared_preferences: ^2.5.4
  get_it: ^7.2.0
  lottie: ^1.2.2
  path_provider: ^2.1.2
  image_picker: ^0.8.9
  carousel_slider: ^4.0.0
  easy_localization: ^3.0.0
  flutter_phoenix: ^1.0.0
  pin_code_fields: ^8.0.0
  loading_animation_widget: ^1.3.0
  fluttertoast: ^9.0.0
  percent_indicator: ^4.2.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  device_info_plus: ^10.0.0
  url_launcher: ^6.1.7
  webview_flutter: ^4.2.1
  permission_handler: ^12.0.1
  change_app_package_name: ^1.2.0
  upgrader: ^12.1.0
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  cryptography_flutter_plus: ^2.3.4
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
#  device_preview: ^1.2.0

  # state management
  flutter_bloc: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.2.3
  build_runner: ^2.1.7
  json_serializable: ^6.1.4

  flutter_localizations:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/loading.json
    - assets/json/error.json
    - assets/json/empty.json
    - assets/json/success.json
    - assets/translations/ar-SA.json
    - assets/translations/en-US.json


  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300

    - family: MadaniArabic
      fonts:
        - asset: assets/fonts/MadaniArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/MadaniArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MadaniArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/MadaniArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/MadaniArabic-Light.ttf
          weight: 300